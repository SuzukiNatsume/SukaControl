name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build installer
        shell: pwsh
        run: ./build.ps1
      - name: Check firmware event boundaries
        shell: pwsh
        run: |
          $test = Start-Process ./dist/SukaControl/SukaControl.exe -ArgumentList '--test-keys' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Key event boundary tests failed' }
      - name: Check performance persistence
        shell: pwsh
        run: |
          dotnet run --project tests/SukaControl.Tests/SukaControl.Tests.csproj -c Release -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Performance persistence tests failed' }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content src/MiControl/MiControl.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match application version' }
          $installer = "dist/SukaControl-Setup-$version.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($installer))" | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          gh release create $env:GITHUB_REF_NAME $installer dist/SHA256SUMS.txt --title "SukaControl $version" --notes-file RELEASE_NOTES.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
